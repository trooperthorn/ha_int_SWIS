name: Test

on:
  push:
  pull_request:
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

jobs:
  pytest:
    name: pytest (Python 3.14)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: requirements_test.txt
      # Pins live in requirements_test.txt so Dependabot can update them.
      # pytest-homeassistant pins the exact matching homeassistant release; the
      # static assert below must equal the homeassistant pin in that file.
      - name: Install the test harness
        run: pip install -r requirements_test.txt
      - name: Verify runtime versions
        run: python -c "from importlib.metadata import version; import sys; print(version('homeassistant')); assert version('homeassistant') == '2026.11.2'; assert version('pytest-homeassistant') == '2026.11.2'; assert sys.version_info[:2] == (3, 14)"
      - name: Run the suite
        run: pytest tests/ -q
      - name: Lint
        run: ruff check custom_components/swis tests
      - name: Type check
        run: mypy --python-version 3.14 custom_components/swis/
